server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets built by Vite are content-hashed and safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: correct MIME for the manifest, and never let the SW go stale.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # API + audio stream proxy. Buffering is off so playback starts immediately
    # and Range requests (seeking) pass straight through to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The origin is only ever reached over HTTPS (Cloudflare in front), so
        # the backend can treat the session cookie as Secure-eligible.
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
